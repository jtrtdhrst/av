name: Deploy AlphaVault MCP

# Wdraża wyłącznie rewizję main z potwierdzonym sukcesem CI.
# Uruchamiaj z main: workflow_dispatch + ref=main lub pełny SHA z main.
# Nie dotyka alphavault.pl ani WordPressa.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main albo pełny SHA commita zawartego w main i zweryfikowanego przez CI"
        required: true
        default: "main"
        type: string
      dry_run:
        description: "Dry run - pokaż zmiany bez zapisu"
        required: false
        default: true
        type: boolean
      writes_enabled:
        description: "Włącz 33 narzędzia zapisu MCP (79 łącznie; zakres alphavault.read, pilot_discord_ids opcjonalne)"
        required: false
        default: true
        type: boolean
      pilot_discord_ids:
        description: "Opcjonalna allowlista Discord ID dla zapisu (CSV); puste = wszyscy z alphavault.read"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-mcp-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate CI-approved MCP revision
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      deploy_sha: ${{ steps.resolve.outputs.deploy_sha }}
    steps:
      - name: Checkout trusted main workflow sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Require main dispatch and successful main CI for exact SHA
        id: resolve
        uses: actions/github-script@v7
        env:
          REQUESTED_REF: ${{ inputs.ref }}
        with:
          script: |
            if (context.ref !== 'refs/heads/main') {
              throw new Error('Deploy AlphaVault MCP must be dispatched from main.');
            }
            if (context.repo.owner !== 'miloszspyrka-code' || context.repo.repo !== 'av') {
              throw new Error('Deploy AlphaVault MCP is restricted to miloszspyrka-code/av.');
            }
            const { assertMcpDeployContext, validateMcpDeploy } = await import(
              `file://${process.env.GITHUB_WORKSPACE}/scripts/validate-mcp-deploy.mjs`
            );
            assertMcpDeployContext(context);
            const deploySha = await validateMcpDeploy({
              github,
              owner: context.repo.owner,
              repo: context.repo.repo,
              requestedRef: process.env.REQUESTED_REF,
            });
            core.setOutput('deploy_sha', deploySha);
            core.info(`Validated deploy revision ${deploySha}.`);

  deploy:
    name: Deploy MCP to mcp.alphavault.pl
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: alphavault-production
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.deploy_sha }}

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_mysql, curl, mbstring, json, openssl
          tools: composer:v2
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validate required secrets
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
          LH_SSH_PRIVATE_KEY: ${{ secrets.LH_SSH_PRIVATE_KEY }}
          LH_SSH_KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_REQUIRED_ROLE_ID: ${{ secrets.DISCORD_REQUIRED_ROLE_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in LH_SSH_HOST LH_SSH_USER LH_SSH_PRIVATE_KEY LH_SSH_KNOWN_HOSTS SESSION_SECRET DB_HOST DB_PORT DB_NAME DB_USER DB_PASSWORD DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET DISCORD_GUILD_ID DISCORD_REQUIRED_ROLE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Uzupełnij sekrety w Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Secret validation passed."

      - name: Prepare SSH material
        env:
          LH_SSH_PRIVATE_KEY: ${{ secrets.LH_SSH_PRIVATE_KEY }}
          LH_SSH_KNOWN_HOSTS: ${{ secrets.LH_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$LH_SSH_PRIVATE_KEY" | sed 's/\r$//' > ~/.ssh/lh_mcp_deploy_key
          chmod 600 ~/.ssh/lh_mcp_deploy_key
          printf '%s\n' "$LH_SSH_KNOWN_HOSTS" | sed 's/\r$//' > ~/.ssh/lh_mcp_known_hosts
          chmod 600 ~/.ssh/lh_mcp_known_hosts
          ssh-keygen -y -P "" -f ~/.ssh/lh_mcp_deploy_key > /dev/null
          echo "SSH material prepared."

      - name: PHP syntax check
        run: |
          set -euo pipefail
          find app mcp -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate MCP write pilot settings
        env:
          WRITES_ENABLED: ${{ inputs.writes_enabled }}
          PILOT_IDS: ${{ inputs.pilot_discord_ids }}
        run: |
          set -euo pipefail
          if [ -n "$PILOT_IDS" ]; then
            if ! printf '%s' "$PILOT_IDS" | grep -Eq '^[0-9]+(,[0-9]+)*$'; then
              echo "::error::pilot_discord_ids musi być listą numerycznych Discord ID rozdzielonych przecinkami."
              exit 1
            fi
          fi
          echo "MCP write settings validated (writes_enabled=$WRITES_ENABLED, pilot=$( [ -n "$PILOT_IDS" ] && echo allowlist || echo all-scoped-users ))."

      - name: Verify deploy script guards
        run: |
          set -euo pipefail
          bash -n scripts/deploy-mcp.sh
          grep -q -- "--exclude='.app'" scripts/deploy-mcp.sh || {
            echo "::error::deploy-mcp.sh musi wykluczać .app z publicznego rsync."
            exit 1
          }
          grep -q "app/db/migrate.php" scripts/deploy-mcp.sh || {
            echo "::error::deploy-mcp.sh musi uruchamiać app/db/migrate.php."
            exit 1
          }
          echo "Deploy script guards present."

      - name: Deploy MCP
        env:
          LH_SSH_HOST: ${{ secrets.LH_SSH_HOST }}
          LH_SSH_PORT: ${{ secrets.LH_SSH_PORT || '40022' }}
          LH_SSH_USER: ${{ secrets.LH_SSH_USER }}
          LH_SSH_PRIVATE_KEY_PATH: /home/runner/.ssh/lh_mcp_deploy_key
          LH_SSH_KNOWN_HOSTS_PATH: /home/runner/.ssh/lh_mcp_known_hosts
          LH_MCP_DEPLOY_PATH: "~/public_html/mcp.alphavault.pl"
          LH_MCP_APP_PATH: "~/public_html/mcp.alphavault.pl/.app"
          MCP_APP_URL: "https://mcp.alphavault.pl"
          MCP_WRITES_ENABLED: ${{ inputs.writes_enabled }}
          MCP_PILOT_DISCORD_IDS: ${{ inputs.pilot_discord_ids }}
          MCP_BUILD_SHA: ${{ needs.validate.outputs.deploy_sha }}
          DRY_RUN: ${{ inputs.dry_run }}
          APP_ENV: production
          ALLOW_DEMO_LOGIN: "false"
          MAX_STATE_BYTES: "12582912"
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_REQUIRED_ROLE_ID: ${{ secrets.DISCORD_REQUIRED_ROLE_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          ADMIN_DISCORD_IDS: ${{ vars.ADMIN_DISCORD_IDS }}
          DISCORD_DEFAULT_PLAN: full
          DISCORD_TRIAL_DAYS: "0"
        run: bash scripts/deploy-mcp.sh
